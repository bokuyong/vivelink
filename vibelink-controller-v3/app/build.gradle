plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vibelink.controller'
    compileSdk 35

    defaultConfig {
        applicationId "com.clodock.control.v5"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "5.0.0"
    }

    flavorDimensions "device"

    productFlavors {
        pa03 {
            dimension "device"
            applicationIdSuffix ".pa03"
            manifestPlaceholders = [appLabel: "clodock Control PA03"]
            buildConfigField "String", "DEVICE_PROFILE", "\"PA03\""
        }
        rpi5 {
            dimension "device"
            applicationIdSuffix ".rpi5"
            manifestPlaceholders = [appLabel: "clodock Control RaspberryPi5"]
            buildConfigField "String", "DEVICE_PROFILE", "\"Raspberry Pi 5\""
        }
        cubiea7z {
            dimension "device"
            applicationIdSuffix ".cubiea7z"
            manifestPlaceholders = [appLabel: "clodock Control CubieA7Z"]
            buildConfigField "String", "DEVICE_PROFILE", "\"Radxa Cubie A7Z\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        // dadb bundles kotlin stdlib - exclude duplicate META-INF files
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // dadb: pure-Java ADB client (no root, ADB over TCP)
    implementation 'dev.mobile:dadb:1.2.9'

    // OkHttp for Gemini API HTTP calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}
